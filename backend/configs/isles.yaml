data:
  train_list: data/isles/isles_train_list.json
  val_list: data/isles/isles_val_list.json

train:
  epochs: 150
  batch_size: 2
  lr: 1e-4
  num_workers: 4
  seed: 42

preprocess:
  pixdim: [1.5, 1.5, 1.5]
  patch_size: [96, 96, 96]
  cache_rate: 0.3

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

output:
  base_dir: runs
  prefix: isles